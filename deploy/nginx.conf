# ============================================================
# wcode — Gitea 定制前端
# Nginx 反代配置，放置于 /etc/nginx/conf.d/wcode.conf
# 修改 server_name 为实际域名
# ============================================================

server {
    listen 80;
    server_name git.example.com;

    # ---- 前端静态站（Vite 构建产物）----
    root /var/www/wcode;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带内容 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 首页与 html 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, no-store";
    }

    # ---- Gitea OpenAPI 反向代理 ----
    location /api/v1 {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 登录页复用 Gitea 原生认证（同域 Cookie）----
    location /user/login {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;
}