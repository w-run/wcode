# ============================================================
# w-box Nginx：私有 npm 静态源（挂到 box.w-run.net 同站点）
# 粘贴到 box.w-run.net 的 server 块内（或 /etc/nginx/conf.d/npm.conf）
# ============================================================

# 私有 npm 源：/workspace/static/npm/ 目录
#   请求 /npm/@w-run/wdesign         → 元数据（@w-run/wdesign.json）
#   请求 /npm/@w-run/wdesign/-/*.tgz → tarball
location ^~ /npm/ {
    root /workspace/static;
    try_files $uri.json $uri =404;

    # 无扩展名元数据文件默认按 JSON 返回
    types { }
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-cache" always;

    # 包体 tarball 走二进制 + 长缓存（文件名带版本，天然不可变）
    location ~ \.tgz$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 兜底：若 nginx 未解码 scope 包的 %2F（如 /@w-run%2Fwdesign）
    # 取消下面注释即可
    # rewrite ^/npm/(@[^/]+)%2F([^/]+)$ /npm/$1/$2 last;
}

# 可选：把 /npm 顶到站点首页做一个包列表页（如为 404 也无碍）