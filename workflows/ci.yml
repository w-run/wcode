# wcode 门禁工作流（本地 runner 执行；亦可复制到 .github/workflows/ 用 GitHub Actions 跑）
# 运行：pnpm runner workflows/ci.yml
name: wcode 门禁

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

env:
  CI: 'true'

jobs:
  check:
    name: 类型检查 / Lint / 测试 / 构建
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: Lint + 格式化
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build

      - name: MCP 服务语法校验
        run: node --check server/mcp/index.mjs

      - name: Runner 语法自检
        run: node --check server/runner/runner.mjs

  smoke:
    name: 冒烟（构建产物）
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: 校验 dist 存在
        run: test -f dist/index.html && echo "dist/index.html 就绪"

      - name: shiki 独立分包
        run: ls dist/assets/shiki-*.js && echo "shiki chunk 已拆分"
